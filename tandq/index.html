<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T & Q Services — Website Previews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Work Sans',sans-serif;background:#f3f0e8;color:#20242c;display:flex;flex-direction:column;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;background:#123a75;color:#f6f3ec;
    border-bottom:3px solid #b8862c;flex-shrink:0;flex-wrap:wrap;gap:12px;
  }
  .topbar-left{display:flex;align-items:center;gap:14px;}
  .mark{
    width:34px;height:34px;background:#b8862c;
    clip-path:polygon(50% 0%,100% 38%,80% 100%,20% 100%,0% 38%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Bitter',serif;font-weight:700;font-size:10px;color:#123a75;
  }
  .topbar-left .title{font-family:'Bitter',serif;font-weight:700;font-size:16px;}
  .topbar-left .subtitle{font-size:12px;color:#c3d0e6;margin-top:1px;}

  .switcher{display:flex;align-items:center;gap:10px;}
  .switcher label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#c3d0e6;font-weight:600;}
  select{
    appearance:none;-webkit-appearance:none;
    background:#f6f3ec;color:#123a75;border:none;border-radius:5px;
    padding:9px 34px 9px 14px;font-size:14px;font-weight:600;font-family:'Work Sans',sans-serif;
    cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23123a75' stroke-width='2' fill='none'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;
  }

  .frame-wrap{flex:1;position:relative;background:#fff;}
  iframe{width:100%;height:100%;border:none;display:block;}

  .loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#f3f0e8;color:#8a7f68;font-size:13px;letter-spacing:.05em;text-transform:uppercase;
    transition:opacity .2s ease;pointer-events:none;
  }
  .loading.hidden{opacity:0;}

  @media(max-width:700px){
    .topbar{flex-direction:column;align-items:flex-start;}
    .switcher{width:100%;}
    select{flex:1;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="mark">T&amp;Q</div>
    <div>
      <div class="title">T &amp; Q Services — Website Previews</div>
      <div class="subtitle">Prepared by Ignite Web Dev</div>
    </div>
  </div>
  <div class="switcher">
    <label for="design-select">Viewing design</label>
    <select id="design-select">
      <option value="homepage1_ranch-homestead.html">Option 1 — Ranch Homestead</option>
      <option value="homepage2_rugged-crew.html">Option 2 — Rugged Crew</option>
      <option value="homepage3_vintage-poster.html">Option 3 — Vintage Poster</option>
      <option value="homepage4_modern-crest.html">Option 4 — Modern Crest</option>
    </select>
  </div>
</div>

<div class="frame-wrap">
  <div class="loading" id="loading">Loading preview…</div>
  <iframe id="preview-frame" src="homepage1_ranch-homestead.html" title="Website design preview"></iframe>
</div>

<script>
  const select = document.getElementById('design-select');
  const frame = document.getElementById('preview-frame');
  const loading = document.getElementById('loading');

  select.addEventListener('change', () => {
    loading.classList.remove('hidden');
    frame.src = select.value;
  });

  frame.addEventListener('load', () => {
    loading.classList.add('hidden');
  });
</script>

</body>
</html>
