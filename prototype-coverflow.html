<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ignite Web Dev — Showcase Coverflow Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  .brand {
    position: fixed; top: 32px; left: 40px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 1.05rem;
    letter-spacing: 0.02em; z-index: 50; display: flex; align-items: center; gap: 10px;
  }
  .brand .flame { color: #ff6b35; font-size: 1.25rem; }
  .back-link {
    position: fixed; top: 36px; right: 40px; z-index: 50;
    color: rgba(255,255,255,0.6); text-decoration: none;
    font-family: 'Space Grotesk', sans-serif; font-size: 0.85rem;
  }
  .back-link:hover { color: #fff; }

  #stage {
    position: relative;
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #glow {
    position: absolute;
    inset: -20%;
    z-index: 0;
    filter: blur(90px);
    opacity: 0.55;
    transition: background 0.7s ease;
    pointer-events: none;
  }

  .eyebrow-fixed {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
    color: #ff6b35;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  #track {
    position: relative;
    width: 100%;
    height: 82vh;
    z-index: 2;
    perspective: 1400px;
    perspective-origin: 50% 50%;
    transform-style: preserve-3d;
    cursor: grab;
  }
  #track.dragging { cursor: grabbing; }

  .card {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(30vw, 460px);
    height: min(42vw, 620px);
    margin-top: calc(min(42vw, 620px) / -2);
    margin-left: calc(min(30vw, 460px) / -2);
    border-radius: 10px;
    overflow: hidden;
    background: #111;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), filter 0.5s ease, opacity 0.5s ease;
    will-change: transform;
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }
  .card img, .card video {
    width: 100%; height: 100%; object-fit: cover; pointer-events: none;
  }
  .card .info {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .card.is-active .info { opacity: 1; }
  .card .info h3 {
    font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; margin-bottom: 4px;
  }
  .card .info p { font-size: 0.82rem; color: rgba(255,255,255,0.7); }
  .card .info a {
    display: inline-block; margin-top: 10px; font-size: 0.78rem;
    color: #ff6b35; text-decoration: none; font-family: 'Space Grotesk', sans-serif;
    border-bottom: 1px solid rgba(255,107,53,0.5);
  }

  .controls {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .controls button {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: #fff; font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
  }
  .controls button:hover { border-color: #ff6b35; color: #ff6b35; background: rgba(255,107,53,0.1); }

  .dots {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 10px;
  }
  .dots button {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: none; padding: 0; cursor: pointer;
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .dots button.active { background: #ff6b35; transform: scale(1.3); }

  @media (max-width: 700px) {
    .card {
      width: 62vw;
      height: 84vw;
      margin-top: calc(84vw / -2);
      margin-left: calc(62vw / -2);
    }
    .eyebrow-fixed { top: 90px; }
  }
</style>
</head>
<body>

<div class="brand"><span class="flame">&#8593;</span> IGNITE WEB DEV</div>
<a href="#" class="back-link">&larr; Back to home</a>

<div id="stage">
  <div id="glow"></div>
  <div class="eyebrow-fixed">01 &mdash; Full Portfolio</div>
  <div id="track"></div>
  <div class="controls">
    <button id="prevBtn" aria-label="Previous project">&#8592;</button>
    <button id="nextBtn" aria-label="Next project">&#8594;</button>
  </div>
  <div class="dots" id="dots"></div>
</div>

<script>
const PROJECTS = [
  {
    title: 'ColdSide Study',
    desc: 'EPA 608 exam prep',
    type: 'img',
    src: 'https://ignitewebdev.com/images/coldside-screenshot-1.png',
    url: 'https://coldsidestudy.netlify.app',
    accent: [56, 189, 248],
  },
  {
    title: 'Signal Lost',
    desc: 'HTML lessons',
    type: 'video',
    src: 'https://ignitewebdev.com/images/signal-demo.mp4',
    url: null,
    accent: [167, 139, 250],
  },
  {
    title: '3FS',
    desc: 'Card game PWA',
    type: 'video',
    src: 'https://ignitewebdev.com/3fs/intro.mp4',
    url: 'https://ignitewebdev.com/3fs/',
    accent: [251, 113, 133],
  },
  {
    title: 'BizCheck',
    desc: 'Job-costing software',
    type: 'img',
    src: 'https://ignitewebdev.com/images/bizcheck-display-1.jpg',
    url: 'https://ignitewebdev.com/bizcheck/',
    accent: [52, 211, 153],
  },
  {
    title: 'Salt Line Kitchen',
    desc: 'Table-side QR ordering',
    type: 'img',
    src: 'https://ignitewebdev.com/saltline/saltline-screenshot-1.jpg',
    url: 'https://ignitewebdev.com/saltline/demo/',
    accent: [251, 191, 36],
  },
  {
    title: 'Neon Province',
    desc: 'Learn CSS through story',
    type: 'video',
    src: 'https://ignitewebdev.com/images/neon-demo.mp4',
    url: null,
    accent: [34, 211, 238],
  },
];

const track = document.getElementById('track');
const glow = document.getElementById('glow');
const dotsWrap = document.getElementById('dots');
let activeIndex = 0;
let cards = [];

function buildCards() {
  PROJECTS.forEach((p, i) => {
    const card = document.createElement('article');
    card.className = 'card';
    const media = p.type === 'video' ? document.createElement('video') : document.createElement('img');
    if (p.type === 'video') {
      media.muted = true; media.autoplay = true; media.loop = true; media.playsInline = true;
    }
    media.src = p.src;
    card.appendChild(media);

    const info = document.createElement('div');
    info.className = 'info';
    info.innerHTML = `<h3>${p.title}</h3><p>${p.desc}</p>` +
      (p.url ? `<a href="${p.url}" target="_blank" rel="noopener">Visit project &rarr;</a>` : `<p style="opacity:0.5;font-style:italic;margin-top:8px;">Link not currently available</p>`);
    card.appendChild(info);

    card.addEventListener('click', () => {
      if (i === activeIndex && p.url) {
        window.open(p.url, '_blank', 'noopener');
      } else if (!dragged) {
        goTo(i);
      }
    });

    track.appendChild(card);
    cards.push(card);

    const dot = document.createElement('button');
    dot.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(dot);
  });
}

const RADIUS_RATIO = 1.74;
let RADIUS = 400;
let dragOffset = 0;

function measureRadius() {
  if (cards.length === 0) return;
  const w = cards[0].getBoundingClientRect().width;
  RADIUS = w * RADIUS_RATIO;
}

function layout() {
  const n = PROJECTS.length;
  const anglePerCard = 360 / n;

  cards.forEach((card, i) => {
    let rel = i - dragOffset;
    rel = ((rel % n) + n) % n;
    if (rel > n / 2) rel -= n;

    const angle = rel * anglePerCard;
    const rad = angle * Math.PI / 180;
    const x = RADIUS * Math.sin(rad);
    const z = RADIUS * Math.cos(rad) - RADIUS;
    const rotateY = angle;

    const front = Math.abs(rel) < 0.001;
    const depthFactor = (z + RADIUS) / RADIUS;
    const opacity = 0.25 + 0.75 * Math.max(0, depthFactor);

    card.style.transform = `translate(-50%, -50%) translateX(${x}px) translateZ(${z}px) rotateY(${rotateY}deg)`;
    card.style.opacity = opacity;
    card.style.zIndex = Math.round(1000 * depthFactor);
    card.classList.toggle('is-active', front);
  });

  Array.from(dotsWrap.children).forEach((d, i) => d.classList.toggle('active', i === activeIndex));

  const c = PROJECTS[activeIndex].accent;
  glow.style.background = `radial-gradient(circle, rgba(${c[0]},${c[1]},${c[2]},0.55), transparent 65%)`;
}

function goTo(i) {
  activeIndex = (i + PROJECTS.length) % PROJECTS.length;
  dragOffset = activeIndex;
  layout();
}

buildCards();
measureRadius();
layout();
window.addEventListener('resize', () => { measureRadius(); layout(); });

document.getElementById('prevBtn').addEventListener('click', () => goTo(activeIndex - 1));
document.getElementById('nextBtn').addEventListener('click', () => goTo(activeIndex + 1));

let dragging = false, dragged = false, startX = 0, startOffset = 0;
const PX_PER_CARD = 90;

track.addEventListener('pointerdown', (e) => {
  dragging = true; dragged = false; startX = e.clientX; startOffset = dragOffset;
  track.classList.add('dragging');
  track.style.transition = 'none';
  cards.forEach(c => c.style.transition = 'opacity 0.5s ease');
});
track.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const delta = e.clientX - startX;
  if (Math.abs(delta) > 8) dragged = true;
  dragOffset = startOffset - delta / PX_PER_CARD;
  layout();
});
window.addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false;
  track.classList.remove('dragging');
  cards.forEach(c => c.style.transition = 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), filter 0.5s ease, opacity 0.5s ease');
  goTo(Math.round(dragOffset));
});

let wheelLock = false;
track.addEventListener('wheel', (e) => {
  if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
  e.preventDefault();
  if (wheelLock) return;
  wheelLock = true;
  goTo(activeIndex + (e.deltaX > 0 ? 1 : -1));
  setTimeout(() => wheelLock = false, 450);
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') goTo(activeIndex - 1);
  if (e.key === 'ArrowRight') goTo(activeIndex + 1);
});
</script>

</body>
</html>
