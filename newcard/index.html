<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ignite Web Dev — Houston</title>
<meta name="theme-color" content="#05060a">
<meta name="description" content="Custom websites, web apps and design. Houston, TX.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#05060a; color:#fff; font-family:'Inter',sans-serif; overflow:hidden; }
  #fx { position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1; }

  .stage {
    position:relative; z-index:2; min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:36px 26px calc(46px + env(safe-area-inset-bottom));
    text-align:center;
  }

  .torch { display:block; margin-bottom:24px; }
  .torch g { fill:#2F7FFF; }

  .word {
    font-family:'Space Grotesk',sans-serif; font-weight:800;
    font-size:clamp(2.5rem, 14vw, 4rem); letter-spacing:-0.03em; line-height:0.9;
    opacity:0; transform:translateY(14px);
  }
  .word.in { animation:rise .8s cubic-bezier(.16,1,.3,1) forwards; }

  .tag {
    font-family:'Space Grotesk',sans-serif; font-size:.68rem; letter-spacing:.34em;
    text-transform:uppercase; color:rgba(255,255,255,.5); margin-top:13px;
    opacity:0; transform:translateY(10px);
  }
  .tag.in { animation:rise .8s cubic-bezier(.16,1,.3,1) .12s forwards; }

  .name {
    margin-top:22px; display:flex; align-items:center; gap:12px;
    opacity:0; transform:translateY(10px);
  }
  .name.in { animation:rise .8s cubic-bezier(.16,1,.3,1) .2s forwards; }
  .name .bar { width:26px; height:1px; background:rgba(255,255,255,.2); }
  .name span {
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:1rem;
    color:rgba(255,255,255,.92); letter-spacing:.01em;
  }

  .actions {
    margin-top:32px; display:flex; flex-direction:column; gap:11px; width:100%; max-width:330px;
    opacity:0; transform:translateY(16px);
  }
  .actions.in { animation:rise .9s cubic-bezier(.16,1,.3,1) .28s forwards; }

  .act {
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:16px 20px; border-radius:10px; text-decoration:none;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:.93rem;
    border:1px solid rgba(255,255,255,.16); color:#fff;
    background:rgba(255,255,255,.05);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .act:active { transform:scale(.975); }
  .act.primary { background:#2F7FFF; border-color:#2F7FFF; color:#05060a; }
  .act svg { flex-shrink:0; }

  .foot {
    margin-top:26px;
    font-family:'Space Grotesk',sans-serif; font-size:.6rem; letter-spacing:.22em;
    text-transform:uppercase; color:rgba(255,255,255,.22);
    opacity:0; animation:fade 1s ease 1s forwards;
  }

  @keyframes rise { to { opacity:1; transform:translateY(0); } }
  @keyframes fade { to { opacity:1; } }

  @media (prefers-reduced-motion: reduce) {
    .word,.tag,.actions { opacity:1 !important; transform:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>

<div class="stage">
  <svg class="torch" id="torch" width="32" height="129" viewBox="0 0 69 278" aria-hidden="true">
    <g>
      <path d="M34.5 0 L16 48 L7 36 L0 67 L16 97 L34.5 50 L53 97 L69 66 L61.5 36 L53 48 Z"/>
      <rect x="16" y="97" width="37" height="181"/>
    </g>
  </svg>

  <h1 class="word" id="word">IGNITE</h1>
  <div class="tag" id="tag">Web &middot; Apps &middot; Design</div>

  <div class="name" id="name">
    <span class="bar"></span>
    <span>Grey Burns</span>
    <span class="bar"></span>
  </div>

  <div class="actions" id="actions">
    <a class="act primary" href="https://ignitewebdev.com">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20a15 15 0 010-20"/>
      </svg>
      See the work
    </a>
    <a class="act" href="mailto:hello@ignitewebdev.com">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2F7FFF" stroke-width="2.2">
        <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/>
      </svg>
      hello@ignitewebdev.com
    </a>
    <a class="act" href="tel:+18327978806">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2F7FFF" stroke-width="2.2">
        <path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.2a2 2 0 012.1-.5c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/>
      </svg>
      832-797-8806
    </a>
  </div>

  <div class="foot">Houston, TX</div>
</div>

<script>
(function(){
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var torchEl = document.getElementById('torch');
  var W = 0, H = 0, DPR = 1;

  function size(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  size();
  window.addEventListener('resize', size);
  window.addEventListener('orientationchange', function(){ setTimeout(size, 120); });

  // Emit from the real torch tip, measured — not guessed from screen centre,
  // so it stays aligned on any phone size or orientation.
  var ox = 0, oy = 0;
  function measure(){
    var r = torchEl.getBoundingClientRect();
    ox = r.left + r.width / 2;
    oy = r.top + r.height * 0.16;   // the flame tip sits ~16% down the artwork
  }
  measure();
  window.addEventListener('resize', measure);
  window.addEventListener('orientationchange', function(){ setTimeout(measure, 140); });

  var parts = [], started = false, t0 = performance.now();
  var MAX = 420;

  function spawn(n, power){
    for (var i = 0; i < n && parts.length < MAX; i++){
      var a = (Math.random() - 0.5) * 0.9;
      var sp = (0.7 + Math.random() * 1.9) * power;
      parts.push({
        x: ox + (Math.random() - 0.5) * 12,
        y: oy + (Math.random() - 0.5) * 8,
        vx: Math.sin(a) * sp * 0.55,
        vy: -Math.abs(Math.cos(a)) * sp - 0.5,
        life: 1,
        decay: 0.008 + Math.random() * 0.016,
        r: 1.1 + Math.random() * 3.4
      });
    }
  }

  var last = performance.now();
  function tick(now){
    var dt = Math.min((now - last) / 16.67, 3); // normalise, clamp after tab-switch
    last = now;
    ctx.clearRect(0, 0, W, H);

    var pulse = 0.5 + Math.sin(now / 620) * 0.09;
    var g = ctx.createRadialGradient(ox, oy + 60, 4, ox, oy + 60, 240);
    g.addColorStop(0,    'rgba(47,127,255,' + (0.30 * pulse).toFixed(3) + ')');
    g.addColorStop(0.45, 'rgba(47,127,255,' + (0.09 * pulse).toFixed(3) + ')');
    g.addColorStop(1,    'rgba(47,127,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (!started && now - t0 > 140){
      started = true;
      measure();
      spawn(150, 3.1);
      document.getElementById('word').classList.add('in');
      document.getElementById('tag').classList.add('in');
      document.getElementById('name').classList.add('in');
      document.getElementById('actions').classList.add('in');
    }
    if (started) spawn(3, 1);

    ctx.globalCompositeOperation = 'lighter';
    for (var i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.vy += 0.012 * dt;
      p.vx *= Math.pow(0.982, dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0){ parts.splice(i, 1); continue; }
      var a = p.life;
      var col = a > 0.72 ? '235,245,255' : (a > 0.4 ? '120,180,255' : '47,127,255');
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.35 + a * 0.9), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + col + ',' + (a * 0.55).toFixed(3) + ')';
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
